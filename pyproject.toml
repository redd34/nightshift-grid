[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nightshift-grid"
version = "0.1.0"
description = "Fault-tolerant local AI batch grid that harvests idle laptops and office PCs, and yields to their humans instantly"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["ollama", "llm", "edge-ai", "graphrag", "mapreduce", "distributed", "mcp", "local-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "psutil>=6.1.0",
    "pydantic>=2.9.0",
    "rich>=13.9.0",
    "cryptography>=42",
    "qdrant-client>=1.12.0",
    "pypdf>=5.0.0",
    "mcp>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyflakes>=3.0"]

[project.urls]
Homepage = "https://github.com/redd34/nightshift-grid"
Issues = "https://github.com/redd34/nightshift-grid/issues"

[project.scripts]
nightshift = "nightshift:main"
nightshift-coordinator = "coordinator:main"
nightshift-worker = "worker_daemon:main"
nightshift-mcp = "mcp_server:main"
nightshift-dashboard = "dashboard:main"
nightshift-credential = "grid_auth:main"

[tool.setuptools]
# Flat modules (the scripts also run directly from a checkout). Install with `uv tool install` or
# `pipx install` so they live in an isolated environment.
py-modules = [
    "chaos_test", "coordinator", "dashboard", "demo_submit", "discovery", "graphrag", "grid_auth",
    "grid_store", "grid_tls", "idle_detection", "ingest", "mcp_server", "nightshift", "qdrant_sink",
    "reduce_graph", "relay", "worker_daemon",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
